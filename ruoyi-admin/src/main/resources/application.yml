# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.9
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_ADMIN_RUOYI_PROFILE}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${RUOYI_ADMIN_PORT}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100；原超配1000。目标部署为 Win2003 32位/2C/2.5GB 单机，
    # 单操作员UI+少量API，50工作线程全忙概率趋近于零，排队10足够
    accept-count: 10
    threads:
      # tomcat最大线程数，默认为200；原超配800。按单操作员场景压到50，省~90条预启线程
      #（32位JVM约45-90MB栈地址空间）
      max: 50
      # Tomcat启动初始化的线程数，默认值10；原超配100，回到默认10
      min-spare: 10

# 日志配置（v3.1.0 五通道治理：全 ruoyi debug 与 core 侧 root=INFO 策略对齐，压日志体积）
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
#  main:
#    lazy-initialization: true   # 这个是核心！延迟初始化，不启动不查库
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # quartz 调度线程池：ruoyi-quartz 的 ScheduleConfig 已整文件注释，实际走 Boot
  # QuartzAutoConfiguration 默认 RAMJobStore + SimpleThreadPool threadCount=10。
  # 目标部署（2C 32位单机）定时任务均为分钟级 tick（env-data-handle 聚合等），
  # 2 条 worker 富余，省 8 条常驻空闲线程。勿用 spring.quartz.thread-count（Boot 2.5 无此属性）
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 2
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST}
    # 端口，默认为6379
    port: ${REDIS_PORT}
    # 数据库索引
    database: ${REDIS_DB}
    # 密码
    password: ${REDIS_PASSWORD}
    # 连接超时时间（命令超时；命中 half-open 死连接时快速失败→Lettuce 重连，而非长挂）
    timeout: 3s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # 连接池最大阻塞等待时间：有限值（原 -1ms 池耗尽无限阻塞→API 挂死），RedisConfig 强制 3s 快速失败
        max-wait: 3s

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${RUOYI_ADMIN_TOKEN_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 43200

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper: 
  helperDialect: postgresql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql 

# Swagger配置
swagger:
  # 是否开启swagger；生产（32位低配单机）不需要API文档页，关闭 /swagger-ui 端点展示
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# springfox 启动期文档构建开关：上面的 swagger.enabled=false 只关 Docket 展示端点，
# 不省启动扫描全部 mapping 建模型的堆开销（springfox 3.0 实测 30-60MB 堆 + 数秒启动）；
# 此处 false 使 DocumentationPluginsBootstrapper 跳过启动扫描，两者配合才是完整关闭
springfox:
  documentation:
    auto-startup: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
