# 数据源配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.postgresql.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
      # 初始连接数；原超配5。目标部署（Win2003 32位单机+本机PG）启动即建 2 条够用
      initialSize: 2
      # 最小连接池数量；原超配10条常驻连接。稳态借方为 ADM 聚合4+consumer2+sweep1+HTTP查询，2 条覆盖
      minIdle: 2
      # 最大连接池数量；峰值借方≈8（17号文档§1.4实测口径），收缩到 8 不再为服务器规模超配
      maxActive: 8
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT version()
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        # druid 监控台的 web URI-JDBC 关联采集过滤器，数据仅供监控台页面消费；
        # 监控台已关（下方 statViewServlet），一并关闭省每请求采样开销
        enabled: false
      statViewServlet:
        # druid 监控台（/druid/*）：单机部署无运维排查价值，关闭省 1 个 servlet；
        # 现场排查需要时可临时改回 true（下方账号配置保留未删）
        enabled: false
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: ruoyi
        login-password: 123456
      filter:
        stat:
          # SQL 统计采样：每条 SQL 的 stat 采样有 CPU/堆累积开销，且监控台已关无处消费；
          # wall 等其他 filter 不动
          enabled: false
          # 慢SQL记录（stat filter 关闭后暂不生效，保留配置供临时重启采样）
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
